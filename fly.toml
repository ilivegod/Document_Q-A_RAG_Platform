# Fly.io deployment for Shiori API
# Deploy: fly deploy (from Document_Q&A_RAG_Platform/)

app = "docqa-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  SENTRY_ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health/live"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
